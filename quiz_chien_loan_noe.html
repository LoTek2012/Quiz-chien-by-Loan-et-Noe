<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz : Quelle race de chien es-tu ?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2ECC71, #27AE60);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-weight: 600;
            color: #fff;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            margin: auto;
            text-align: left;
            padding-bottom: 10px;
        }

        .question {
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .options {
            display: flex;
            gap: 10px;
            justify-content: space-around;
        }

        input[type="radio"] {
            accent-color: #27AE60;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #27AE60;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #219653;
        }

        /* Style pour la pop-up */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: white;
            opacity: 0.7;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>Quelle race de chien es-tu ?</h1>
    <form id="quizForm">
        <div class="question">
            <label>Es-tu sportif ?</label>
            <div class="options">
                <input type="radio" name="sportif" value="Oui"> Oui
                <input type="radio" name="sportif" value="Non"> Non
            </div>
        </div>

        <div class="question">
            <label>Aimes-tu courir vite ?</label>
            <div class="options">
                <input type="radio" name="courir" value="Oui"> Oui
                <input type="radio" name="courir" value="Non"> Non
            </div>
        </div>

        <div class="question">
            <label>Es-tu obéissant ?</label>
            <div class="options">
                <input type="radio" name="obeissant" value="Oui"> Oui
                <input type="radio" name="obeissant" value="Non"> Non
            </div>
        </div>

        <div class="question">
            <label>Aimes-tu l'eau ?</label>
            <div class="options">
                <input type="radio" name="eau" value="Oui"> Oui
                <input type="radio" name="eau" value="Non"> Non
            </div>
        </div>

        <div class="question">
            <label>As-tu toujours chaud, froid ou ni l'un ni l'autre ?</label>
            <div class="options">
                <input type="radio" name="temperature" value="Chaud"> Chaud
                <input type="radio" name="temperature" value="Froid"> Froid
                <input type="radio" name="temperature" value="ni l'un ni l'autre"> Ni l'un ni l'autre
            </div>
        </div>

        <div class="question">
            <label>Aimes-tu partager ?</label>
            <div class="options">
                <input type="radio" name="partager" value="Oui"> Oui
                <input type="radio" name="partager" value="Non"> Non
            </div>
        </div>

        <div class="question">
            <label>Es-tu protecteur ?</label>
            <div class="options">
                <input type="radio" name="protecteur" value="Oui"> Oui
                <input type="radio" name="protecteur" value="Non"> Non
            </div>
        </div>

        <button type="button" onclick="calculerRace()">Valider</button>
    </form>

    <div class="overlay" id="overlay" onclick="fermerPopup()"></div>
    <div class="popup" id="popup">
        <h2 id="resultat"></h2>
        <img id="imageChien" src="" alt="Race de chien" style="width: 200px; border-radius: 10px;">
        <button onclick="fermerPopup()">Fermer</button>
        <button onclick="refaireQuiz()">Refaire le Quiz</button>
    </div>

    <script>
        function calculerRace() {
            const reponses = Array.from(document.querySelectorAll('input[type="radio"]:checked')).map(input => input.value || "Non");

            if (reponses.length < 7) {
                alert("Veuillez répondre à toutes les questions !");
                return;
            }

            const races = [
                {nom: "Golden Retriever", attributs: ["Oui", "Non", "Oui", "Oui", "ni l'un ni l'autre", "Oui", "Non"]},
                {nom: "Berger Australien", attributs: ["Oui", "Oui", "Oui", "Oui", "ni l'un ni l'autre", "Oui", "Inconnu"]},
                {nom: "Teckel", attributs: ["Oui", "Non", "Oui", "Non", "Froid", "Non", "Oui"]},
                {nom: "Husky", attributs: ["Oui", "Oui", "Non", "Non", "Chaud", "Non", "Oui"]},
                {nom: "Chihuahua", attributs: ["Non", "Non", "Non", "Non", "Froid", "Non", "Oui"]},
                {nom: "Malinois", attributs: ["Oui", "Oui", "Oui", "Oui", "ni l'un ni l'autre", "Oui", "Oui"]}
            ];

            const meilleureRace = races.reduce((best, race) => {
                const score = race.attributs.filter((attr, i) => attr === reponses[i]).length;
                return score > best.score ? { nom: race.nom, score } : best;
            }, { nom: "", score: -1 }).nom;

            document.getElementById("resultat").innerText = `Tu es un :\n${meilleureRace}`;
            document.getElementById("popup").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

            const imagesChien = {
                "Golden Retriever": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Golden_retriever_stehfoto.jpg/330px-Golden_retriever_stehfoto.jpg",
                "Berger Australien": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Mon_chien_est_parfait.png/250px-Mon_chien_est_parfait.png",
                "Teckel": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Std_Dachshund_600.jpg/330px-Std_Dachshund_600.jpg",
                "Husky": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Moscow_et_Owana_de_l%E2%80%99%C3%A9levage_Of_Kolyma_Wolves.jpg/250px-Moscow_et_Owana_de_l%E2%80%99%C3%A9levage_Of_Kolyma_Wolves.jpg",
                "Chihuahua": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Chihuahuas-_Holly%2C_Nina%2C_Doralice.jpg/250px-Chihuahuas-_Holly%2C_Nina%2C_Doralice.jpg",
                "Malinois": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Malinois.snow.jpg/250px-Malinois.snow.jpg"
            };

            document.getElementById("imageChien").src = imagesChien[meilleureRace] || "https://example.com/images/default.jpg";


        function fermerPopup() {
            document.getElementById("popup").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        function refaireQuiz() {
            document.getElementById("quizForm").reset();
            fermerPopup();
        }
    </script>

    <div class="footer">By Loan et Noé</div>
</body>
</html>
